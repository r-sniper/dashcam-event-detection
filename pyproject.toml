[project]
name = "dashcam-event-detection"
version = "0.1.0"
description = "Detect and review road events in front-camera dashcam footage."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24,<3",
    "opencv-python-headless>=4.8,<5",
    "scipy>=1.10,<2",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
vehicle = [
    "open-image-models[onnx]>=0.6,<0.7",
    "rapidocr>=3.10,<4 ; python_full_version < '4'",
]

[dependency-groups]
dev = [
    "numpy-typing-compat==20260602.2.5",
    "optype==0.19.0",
    "scipy-stubs==1.18.1.1",
]
